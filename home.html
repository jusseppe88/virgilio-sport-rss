<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="darkreader-lock" />
  <title>Guida TV Sport — Homepage</title>
  <style>
    :root{
      --bg:#0a0a0b; --fg:#ffffff; --muted:#d1d5db; --card:#0d1117; --border:#334155; --accent:#60a5fa;
    }
    [data-theme="light"]{
      --bg:#f7f7f8; --fg:#0b0c0f; --muted:#4b5563; --card:#ffffff; --border:#e5e7eb; --accent:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header,footer{background:var(--card);border-bottom:1px solid var(--border)}
    header{position:sticky;top:0;z-index:10;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
    .spacer{flex:1 1 auto}
    .btn{border:1px solid var(--border);background:transparent;color:var(--fg);padding:8px 11px;border-radius:10px;cursor:pointer;font-weight:600}
    .btn:hover{border-color:#64748b}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input[type="date"]{background:var(--card);color:var(--fg);border:1px solid var(--border);padding:8px 10px;border-radius:10px}
    label{color:var(--muted)}
    main{padding:16px}
    #content > .day{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 auto 16px;max-width:1100px}
    .note{color:var(--muted);font-size:13px;margin:4px 0 8px}
    .link{color:var(--accent);text-decoration:none}
    .link:hover{text-decoration:underline}
    footer{padding:8px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
    .shadow-host{display:block}
    .shadow-host section.day > h2 { display:none }
  </style>
</head>
<body>
  <header>
    <h1>Guida TV Sport</h1>
    <div class="row">
      <button class="btn" id="prevBtn">◀︎</button>
      <input type="date" id="datePick" />
      <button class="btn" id="todayBtn">Oggi</button>
      <button class="btn" id="nextBtn">▶︎</button>
      <button class="btn" id="refreshBtn">↻</button>
    </div>
    <div class="spacer"></div>
    <div class="row">
      <label><input type="checkbox" id="tomorrowToggle"/> Domani</label>
      <label><input type="checkbox" id="themeToggle"/> Tema chiaro</label>
    </div>
  </header>

  <main>
    <div class="note">Mirror: <a id="mirrorLink" class="link" href="./tables.html" target="_blank" rel="noopener">tables.html</a></div>
    <div class="note">Sport: icona e colore. Bandiere: paese/lingua indicati dal canale; audio non verificato.</div>
    <div id="content"></div>
    <div id="guide-status" class="note"></div>
    <div id="guide-gaps" class="note"></div>
  </main>

  <footer>Consiglio: aggiungi questa pagina ai preferiti o impostala come pagina iniziale.</footer>

  <script>
    const BASE = "./tables.html";
    const TZ   = "Europe/Rome";
    const fmtYMD = d => new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
    const parseYMD = s => {const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d));};
    const addDays = (ymd,n)=>{const d=parseYMD(ymd); d.setUTCDate(d.getUTCDate()+n); return fmtYMD(d);};

    const datePick=document.getElementById('datePick');
    const prevBtn=document.getElementById('prevBtn');
    const nextBtn=document.getElementById('nextBtn');
    const todayBtn=document.getElementById('todayBtn');
    const refreshBtn=document.getElementById('refreshBtn');
    const tomorrowToggle=document.getElementById('tomorrowToggle');
    const content=document.getElementById('content');
    const mirrorLink=document.getElementById('mirrorLink');
    const themeToggle=document.getElementById('themeToggle');

    const savedTheme = localStorage.getItem('sportsHomeTheme')||'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.checked = savedTheme==='light';
    themeToggle.addEventListener('change',()=> {
      const t=themeToggle.checked?'light':'dark';
      document.documentElement.setAttribute('data-theme',t);
      localStorage.setItem('sportsHomeTheme',t);
      syncShadowThemes();
    });

    const shadowHosts = new Set();
    async function fetchTables(){
      const res = await fetch(`${BASE}?v=${Date.now()}`, {mode:'cors', credentials:'omit', cache:'no-store'});
      if(!res.ok) throw new Error('Fetch failed '+res.status);
      return await res.text();
    }
    function pickDay(dom, ymd){ return dom.querySelector(`section.day#${CSS.escape(ymd)}`) || null; }
    function labelIT(ymd){ return new Date(ymd).toLocaleDateString('it-IT',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
    function sanitizeSection(sec){
      const clean = sec.cloneNode(true);
      clean.querySelectorAll('style,link').forEach(n => n.remove());
      clean.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
      return clean;
    }
    // Presentation only: the imported names and event grouping stay unchanged.
    const SPORT_VISUALS = [
      [/football americano|american football|nfl/i, '🏈', 25],
      [/tennistavolo|table tennis/i, '🏓', 190],
      [/calcio|soccer|football/i, '⚽', 145],
      [/basket/i, '🏀', 28],
      [/tennis/i, '🎾', 75],
      [/rugby/i, '🏉', 330],
      [/pallavolo|volley/i, '🏐', 205],
      [/pallamano|handball/i, '🤾', 275],
      [/motociclismo|motogp/i, '🏍️', 265],
      [/automobilismo|formula/i, '🏎️', 0],
      [/ciclismo/i, '🚴', 175],
      [/hockey/i, '🏒', 210],
      [/baseball/i, '⚾', 35],
      [/golf/i, '⛳', 110],
      [/padel/i, '🎾', 90],
      [/boxe|boxing/i, '🥊', 355],
      [/arti marziali|mma/i, '🥋', 10],
      [/snooker|biliardo/i, '🎱', 165],
      [/freccette/i, '🎯', 345],
      [/sci|ski/i, '⛷️', 200],
      [/nuoto/i, '🏊', 195],
      [/atletica/i, '🏃', 45],
      [/pattinaggio/i, '⛸️', 230],
      [/cricket/i, '🏏', 55],
      [/vela/i, '⛵', 220],
      [/surf/i, '🏄', 185],
      [/badminton/i, '🏸', 120],
      [/pallanuoto/i, '🤽', 250],
    ];
    function sportVisual(sport){
      const match = SPORT_VISUALS.find(([pattern])=>pattern.test(sport));
      return match ? {icon:match[1], hue:match[2]} : {icon:'🏅', hue:240};
    }
    const CHANNEL_COUNTRIES = {
      IT:['🇮🇹', 'Italia · Italiano'],
      ARG:['🇦🇷', 'Argentina · Spagnolo'], AR:['🇦🇷', 'Argentina · Spagnolo'],
      CH:['🇨🇭', 'Svizzera · Lingua audio non specificata'],
      DE:['🇩🇪', 'Germania · Tedesco'], ES:['🇪🇸', 'Spagna · Spagnolo'],
      FR:['🇫🇷', 'Francia · Francese'], NL:['🇳🇱', 'Paesi Bassi · Olandese'],
      PL:['🇵🇱', 'Polonia · Polacco'], PT:['🇵🇹', 'Portogallo · Portoghese'],
      RO:['🇷🇴', 'Romania · Rumeno'], RU:['🇷🇺', 'Russo'],
      UK:['🇬🇧', 'Regno Unito · Inglese'], GB:['🇬🇧', 'Regno Unito · Inglese'],
      US:['🇺🇸', 'Stati Uniti · Inglese'],
    };
    // These unsuffixed names belong to the guide's Italian lineup. Unknown
    // names never receive a guessed language, including future new channels.
    const ITALIAN_CHANNEL = new Set([
      "20 hd", "27 twentyseven hd", "boing hd", "canale 5 hd",
      "cartoonito hd", "cielo hd", "cine34 hd", "dazn 1",
      "dazn 2", "discovery", "discovery turbo", "dmax",
      "eurosport 1", "eurosport 2", "focus hd", "food network",
      "frisbee", "giallo", "hgtv", "iris hd",
      "italia 1 hd", "italiana hd", "k2", "la 5 hd",
      "la 7 cinema", "la 7 hd", "mediaset extra hd", "mediaset italia 2 hd",
      "nove", "qvc", "rai 1 hd", "rai 2 hd",
      "rai 3 hd", "rai 4 hd", "rai 5 hd", "rai gulp hd",
      "rai movie hd", "rai news 24 hd", "rai premium hd", "rai sport hd",
      "rai storia hd", "rai yoyo hd", "real time", "rete 4 hd",
      "sky sport 1 hd", "sky sport 251", "sky sport 252", "sky sport 253",
      "sky sport 254", "sky sport 255", "sky sport 256", "sky sport 257",
      "sky sport 258", "sky sport 259", "sky sport arena", "sky sport basket",
      "sky sport calcio", "sky sport max", "sky sport mix", "sky sport tennis",
      "sportitalia hd", "super!", "tgcom24 hd", "top crime hd",
      "tv2000", "tv8 hd",
    ]);
    function channelVisual(line){
      const number = line.match(/\s*·\s*\d+(?:\.\d+)?\s*$/)?.[0] || '';
      const name = line.slice(0, line.length-number.length).trim();
      const suffix = name.match(/\s*\(([^()]*)\)$/);
      const tag = suffix?.[1] || '';
      const audio = tag.match(/^(.*?),\s*([A-Z]{2,3}) audio$/i);
      const code = audio ? audio[2].toUpperCase() : tag.toUpperCase();
      const country = CHANNEL_COUNTRIES[code] || (!suffix && ITALIAN_CHANNEL.has(name.toLowerCase()) ? CHANNEL_COUNTRIES.IT : null);
      if (!country) return {text:line};
      const base = suffix ? name.slice(0, suffix.index) : name;
      const region = audio ? ` (${audio[1]})` : '';
      return {text:base+region+number, flag:country[0], label:country[1]};
    }
    function buildChannels(cell){
      const wrap = document.createElement('div');
      // Split on the renderer's BR separators while decoding text through DOM.
      const parts = (cell?.innerHTML || '').split(/<br\s*\/?\s*>/i);
      for (const part of parts){
        const decoded = document.createElement('span'); decoded.innerHTML=part;
        const original = decoded.textContent.trim();
        if (!original) continue;
        const visual = channelVisual(original);
        const line = document.createElement('div'); line.className='channel';
        if (visual.flag){
          const flag = document.createElement('span'); flag.className='channel-flag';
          flag.textContent=visual.flag; flag.title=visual.label;
          flag.setAttribute('role','img'); flag.setAttribute('aria-label',visual.label);
          line.appendChild(flag);
        }
        const name = document.createElement('span'); name.textContent=visual.text;
        line.appendChild(name); wrap.appendChild(line);
      }
      return wrap;
    }
    function buildEventoHTML(sportText, compText, eventoHTML){
      const s = (sportText||'').trim();
      const c = (compText||'').trim();
      const wrap = document.createElement('div');
      const icon = document.createElement('span'); icon.className='sport-icon';
      icon.textContent=sportVisual(s).icon; icon.setAttribute('aria-hidden','true');
      wrap.append(icon, document.createTextNode(' '));
      const strong = document.createElement('strong'); strong.textContent = s; wrap.appendChild(strong);
      wrap.appendChild(document.createTextNode(c ? `, ${c}:` : ':'));
      wrap.appendChild(document.createElement('br'));
      const evento = document.createElement('span'); evento.innerHTML = eventoHTML || ''; wrap.appendChild(evento);
      return wrap.innerHTML;
    }

    function renderIntoShadow(container, sectionEl){
      const host = document.createElement('div');
      host.className = 'shadow-host';
      host.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')||'dark');
      content.appendChild(host);
      shadowHosts.add(host);
      container.appendChild(host);

      const root = host.attachShadow({mode:'open'});
      const style = document.createElement('style');
      style.textContent = `
        :host{
          --bg:#0d1117; --text:#f9fafb; --thead-bg:#0b1220; --thead-fg:#e5e7eb; --border:#334155; --link:#60a5fa;
          display:block;
        }
        :host([data-theme="light"]){
          --bg:#ffffff; --text:#0b0c0f; --thead-bg:#f3f4f6; --thead-fg:#0b0c0f; --border:#d1d5db; --link:#2563eb;
        }
        .frame{
          border:1px solid var(--border);
          border-radius:12px;
          background:var(--bg);
          overflow-x:auto;
          -webkit-overflow-scrolling: touch;
        }
        .inner{padding:0;width:100%}
        table{border-collapse:collapse;width:100%;table-layout:fixed}
        /* base (mobile-first) widths */
        th:nth-child(1), td:nth-child(1){width:55px;white-space:nowrap;text-align:center}
        th:nth-child(2), td:nth-child(2){width:auto}
        th:nth-child(3), td:nth-child(3){width:90px;word-break:break-word}
        th,td{
          border:1px solid var(--border);
          padding:6px 8px;
          vertical-align:top;
          color:var(--text);
          font-size:14px;
          line-height:1.35;
          overflow-wrap:break-word;
          word-break:break-word;
          hyphens:auto;
        }
        thead th{background:var(--thead-bg);color:var(--thead-fg);text-align:left;position:sticky;top:0}
        a{color:var(--link);text-decoration:none}
        a:hover{text-decoration:underline}
        @media (max-width:480px){
          th,td{padding:4px 6px;font-size:13px}
          th:nth-child(3), td:nth-child(3){width:70px}
        }
        /* desktop: keep Evento compact, give Canali a fixed readable width */
        @media (min-width:900px){
          th:nth-child(1), td:nth-child(1){width:40px}
          th:nth-child(2), td:nth-child(2){width:52ch; max-width:52ch}
          th:nth-child(3), td:nth-child(3){width:26ch}
        }
        tbody tr{--sport-hue:240}
        tbody td{background:hsl(var(--sport-hue) 30% 14%)}
        tbody tr:hover td{background:hsl(var(--sport-hue) 34% 19%)}
        tbody td:first-child{box-shadow:inset 4px 0 hsl(var(--sport-hue) 65% 61%)}
        :host([data-theme="light"]) tbody td{background:hsl(var(--sport-hue) 65% 95%)}
        :host([data-theme="light"]) tbody tr:hover td{background:hsl(var(--sport-hue) 65% 90%)}
        :host([data-theme="light"]) tbody td:first-child{box-shadow:inset 4px 0 hsl(var(--sport-hue) 65% 38%)}
        .sport-icon{font-size:1.15em}
        .channel{display:flex;align-items:baseline;gap:5px;margin-bottom:4px}
        .channel:last-child{margin-bottom:0}
        .channel-flag{flex:0 0 auto;font-size:1.15em;line-height:1}
        section.day > h2 { display:none }
      `;
      root.appendChild(style);

      const frame = document.createElement('div');
      frame.className = 'frame';
      const inner = document.createElement('div');
      inner.className = 'inner';
      frame.appendChild(inner);
      root.appendChild(frame);

      const clean = sanitizeSection(sectionEl);
      const table = clean.querySelector('table');
      if (table) {
        const trHead = table.querySelector('thead tr');
        if (trHead) trHead.innerHTML = '<th>Ora</th><th>Evento</th><th>Canali</th>';
        table.querySelectorAll('tbody tr').forEach(tr=>{
          const tds = Array.from(tr.children);
          const ora=tds[0]?.innerHTML||'', sport=tds[1]?.textContent||'', comp=tds[2]?.textContent||'',
                evento=tds[3]?.innerHTML||'';
          const eventoHTML=buildEventoHTML(sport,comp,evento);
          const ntr=document.createElement('tr');
          ntr.style.setProperty('--sport-hue',sportVisual(sport).hue);
          const td1=document.createElement('td'); td1.innerHTML=ora;
          const td2=document.createElement('td'); td2.innerHTML=eventoHTML;
          const td3=document.createElement('td'); td3.appendChild(buildChannels(tds[4]));
          ntr.append(td1,td2,td3); tr.replaceWith(ntr);
        });
      }
      inner.appendChild(clean);
    }

    function syncShadowThemes(){
      const theme=document.documentElement.getAttribute('data-theme')||'dark';
      shadowHosts.forEach(h=>h.setAttribute('data-theme',theme));
    }

    async function render(ymd,alsoTomorrow){
      content.innerHTML='<div class="note">Caricamento…</div>';
      shadowHosts.clear();
      try{
        const html=await fetchTables();
        const dom=new DOMParser().parseFromString(html,'text/html');
        const guideStatus=dom.getElementById('guide-status');
        let statusText=guideStatus?.textContent||'';
        const exported=guideStatus?.getAttribute('data-exported-at');
        if(exported && Date.now()-Date.parse(exported)>3*60*60*1000 && !statusText.includes('ATTENZIONE')){
          statusText+=' ATTENZIONE: esportazione EPG non aggiornata da oltre 3 ore.';
        }
        document.getElementById('guide-status').textContent=statusText;
        const guideGaps=dom.getElementById('guide-gaps');
        document.getElementById('guide-gaps').replaceChildren(...(guideGaps ? [sanitizeSection(guideGaps)] : []));
        const frag=document.createDocumentFragment();
        const addBox=dstr=>{
          const sec=pickDay(dom,dstr);
          const box=document.createElement('div'); box.className='day';
          const h=document.createElement('h2'); h.textContent=labelIT(dstr); h.style.margin='4px 0 8px';
          box.appendChild(h);
          if(sec)renderIntoShadow(box,sec); else box.innerHTML+='<div class="note">Nessun dato disponibile.</div>';
          frag.appendChild(box);
        };
        addBox(ymd); if(alsoTomorrow)addBox(addDays(ymd,1));
        content.innerHTML=''; content.appendChild(frag);
        syncShadowThemes();
      }catch(err){
        content.innerHTML=`<div class="day"><div class="note">Errore: ${String(err)}</div><div class="note">Apri: <a class="link" href="${BASE}" target="_blank" rel="noopener">${BASE}</a></div></div>`;
      }
    }
    function setDate(ymd){
      datePick.value=ymd; mirrorLink.href=`${BASE}#${ymd}`;
      render(ymd,tomorrowToggle.checked);
    }

    const todayYMD=fmtYMD(new Date());
    setDate(todayYMD);
    window.addEventListener('pageshow', event=>{
      if(event.persisted)setDate(fmtYMD(new Date()));
    });

    prevBtn.addEventListener('click',()=>setDate(addDays(datePick.value,-1)));
    nextBtn.addEventListener('click',()=>setDate(addDays(datePick.value,1)));
    todayBtn.addEventListener('click',()=>setDate(fmtYMD(new Date())));
    refreshBtn.addEventListener('click',()=>setDate(datePick.value));
    datePick.addEventListener('change',()=>setDate(datePick.value));
    tomorrowToggle.addEventListener('change',()=>setDate(datePick.value));
  </script>
</body>
</html>
