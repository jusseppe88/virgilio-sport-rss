name: Publish imported EPG
on:
  push:
    branches: [main]
    paths: [dispatcharr_epg.json, epg_schedule.py, test_epg_schedule.py, .github/workflows/publish-epg.yml]
  workflow_dispatch:
concurrency:
  group: sports-guide-pages
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test imported guide rendering
        run: python -m unittest test_epg_schedule -v
      - name: Render imported guide
        run: python epg_schedule.py
      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tables.html rss.xml rss_tables.xml epg_status.json
          git diff --cached --quiet || git commit -m "Render imported Dispatcharr EPG"
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
